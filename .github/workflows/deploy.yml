name: Build and Deploy PDF Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-project/package-lock.json

      - name: Build React frontend
        working-directory: my-project
        run: |
          npm ci
          npm run build

      - name: Prepare deployment files
        run: |
          mkdir -p deploy/backend
          mkdir -p deploy/my-project
          cp backend/main.py deploy/backend/
          cp backend/requirements.txt deploy/backend/
          cp -r my-project/dist deploy/my-project/

      - name: Copy files to Ubuntu
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/**"
          target: "/home/ubuntu/pdf-manager"
          strip_components: 1
          overwrite: true

      - name: Install dependencies and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/pdf-manager/backend

            python3 -m venv .venv
            .venv/bin/pip install -r requirements.txt

            sudo systemctl daemon-reload
            sudo systemctl enable pdf-manager
            sudo systemctl restart pdf-manager

            sudo systemctl is-active --quiet pdf-manager

            curl -fsS http://127.0.0.1:8000/