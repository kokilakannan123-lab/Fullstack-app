
name: Build and Deploy PDF Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kokilakannan123-lab/fullstack-app

jobs:
  build-push:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Pull Image and Run on Ubuntu
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            IMAGE="ghcr.io/kokilakannan123-lab/fullstack-app:latest"
            APP_DIR="/home/ubuntu/pdf-manager"

            mkdir -p "$APP_DIR/data"

            echo "Pulling latest image..."
            docker pull "$IMAGE"

            echo "Stopping old systemd service..."
            sudo systemctl disable --now pdf-manager || true

            echo "Removing old container if present..."
            docker rm -f pdf-manager-container || true

            echo "Starting new container..."
            docker run -d \
              --name pdf-manager-container \
              --restart unless-stopped \
              -p 8000:8000 \
              -v "$APP_DIR/data:/data" \
              "$IMAGE"

            echo "Waiting for FastAPI to become ready..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/; then
                echo "PDF Manager is responding."
                exit 0
              fi
              sleep 2
            done

            echo "Application did not become ready."
            docker logs --tail 100 pdf-manager-container
            exit 1
