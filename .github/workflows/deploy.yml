
name: Build and Deploy Fullstack App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/kokila/fullstack-app
            git fetch origin main
            git reset --hard origin/main
            docker build -t kokila-fullstack:latest .
            docker rm -f kokila-fullstack-container 2>/dev/null || true
            docker run -d \
              --name kokila-fullstack-container \
              --restart unless-stopped \
              -p 8002:8000 \
              kokila-fullstack:latest
            docker ps --filter name=kokila-fullstack-container
            curl -fsS http://127.0.0.1:8002/api/hello
